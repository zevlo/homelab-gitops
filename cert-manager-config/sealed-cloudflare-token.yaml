# Cloudflare API token for DNS-01 challenges — sealed to this name/namespace
# (strict scope). Token permission: Zone → DNS → Edit on zachallen.io only.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  encryptedData:
    api-token: 
  template:
    metadata:
      name: cloudflare-api-token
      namespace: cert-manager
    type: Opaque
