# Throwaway verification app — proves Sealed Secrets round-trip via GitOps.
# Removed after Stage 4 verification.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test-sealedsecret
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:zevlo/homelab-gitops.git
    targetRevision: main
    path: test
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
