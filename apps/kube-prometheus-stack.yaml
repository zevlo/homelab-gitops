# kube-prometheus-stack — Prometheus + Grafana + Alertmanager + node-exporter + kube-state-metrics.
# Helm chart repo is fetched directly by ArgoCD (no local `helm repo add` needed).
# Values are inline because the app sources a *chart repo*, not a git path
# (ArgoCD's valueFiles only works for git-sourced charts).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.21.0
    helm:
      # CRDs are installed manually (kubectl --server-side) as a bootstrap step —
      # ArgoCD's client-side apply overflows the 256KB annotation limit on these
      # huge CRDs. skipCrds makes ArgoCD ignore them and manage only the chart's
      # templates (Prometheus/Alertmanager CRs, Deployments, etc.).
      skipCrds: true
      values: |
        global:
          rbac:
            pspEnabled: false
        # Operator: keep off the Dell (GPU node) + drop the admission webhooks
        # (their cert-gen jobs misbehave under ArgoCD; validation is optional for a homelab).
        prometheusOperator:
          nodeSelector:
            node-role.kubernetes.io/worker: worker
          admissionWebhooks:
            enabled: false
        prometheus:
          prometheusSpec:
            retention: 14d
            nodeSelector:
              node-role.kubernetes.io/worker: worker
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
        alertmanager:
          alertmanagerSpec:
            nodeSelector:
              node-role.kubernetes.io/worker: worker
        grafana:
          admin:
            existingSecret: grafana-admin
            existingSecretKey: admin-password
          grafana.ini:
            server:
              root_url: https://grafana.zachallen.io
          # TLS via Traefik ingress + cert-manager; cert is issued automatically from
          # the cluster-issuer annotation (cert-manager creates Certificate + secret grafana-tls).
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
            hosts:
              - grafana.zachallen.io
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.zachallen.io
          persistence:
            enabled: true
            size: 2Gi
            storageClassName: local-path
          nodeSelector:
            node-role.kubernetes.io/worker: worker
          service:
            type: ClusterIP
        kube-state-metrics:
          nodeSelector:
            node-role.kubernetes.io/worker: worker
        prometheus-node-exporter:
          tolerations:
            - operator: Exists
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
