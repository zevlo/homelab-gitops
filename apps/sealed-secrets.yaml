# Sealed Secrets self-management (Stage 5) — adopts the hand-installed v0.38.4.
# Vendored from https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.38.4/controller.yaml.
# The sealing key Secret is generated at runtime by the controller — not in Git, not app-owned.
#
# selfHeal OFF per self-management policy.
# Rollback: `argocd app delete sealed-secrets --cascade=false` — cascading would
# delete the SealedSecret CRD and garbage-collect every decrypted Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:zevlo/homelab-gitops.git
    targetRevision: main
    path: sealed-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - ServerSideApply=true
