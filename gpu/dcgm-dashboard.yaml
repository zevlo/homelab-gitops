# Grafana dashboard for the DCGM metrics. Loaded by the kube-prometheus-stack
# grafana-sc-dashboard sidecar (label `grafana_dashboard=1`, scans all namespaces).
# Datasource uid `prometheus` is fixed by kube-prometheus-stack's datasource ConfigMap.
# Surfaces the NCP-AIO "key measures for monitoring GPUs": util, mem, temp, power,
# clocks, XID faults, ECC errors (ECC is off on the A2000 → that panel stays empty).
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-dcgm-dashboard
  namespace: gpu-operator
  labels:
    grafana_dashboard: "1"
data:
  nvidia-dcgm.json: |
    {
      "uid": "nvidia-dcgm-a2000",
      "title": "NVIDIA DCGM \u2014 RTX A2000",
      "tags": ["nvidia", "dcgm", "gpu"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "hostname",
            "type": "query",
            "label": "GPU node",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(DCGM_FI_DEV_GPU_UTIL, Hostname)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "current": { "selected": true, "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "type": "timeseries", "title": "GPU Utilization",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "avg(DCGM_FI_DEV_GPU_UTIL{Hostname=~\"$hostname\"})", "legendFormat": "util %" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single", "sort": "none" } }
        },
        {
          "type": "timeseries", "title": "Memory Copy Utilization",
          "gridPos": { "h": 8, "w": 6, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "avg(DCGM_FI_DEV_MEM_COPY_UTIL{Hostname=~\"$hostname\"})", "legendFormat": "mem copy %" }],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single", "sort": "none" } }
        },
        {
          "type": "timeseries", "title": "Frame Buffer Used",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "avg(DCGM_FI_DEV_FB_USED{Hostname=~\"$hostname\"})", "legendFormat": "FB used" }],
          "fieldConfig": { "defaults": { "unit": "mbytes" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single", "sort": "none" } }
        },
        {
          "type": "timeseries", "title": "Temperature",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "avg(DCGM_FI_DEV_GPU_TEMP{Hostname=~\"$hostname\"})", "legendFormat": "temp" }],
          "fieldConfig": { "defaults": { "unit": "celsius" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single", "sort": "none" } }
        },
        {
          "type": "timeseries", "title": "Power Draw",
          "gridPos": { "h": 8, "w": 6, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "avg(DCGM_FI_DEV_POWER_USAGE{Hostname=~\"$hostname\"})", "legendFormat": "power" }],
          "fieldConfig": { "defaults": { "unit": "watt" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single", "sort": "none" } }
        },
        {
          "type": "timeseries", "title": "Clocks (SM / Mem)",
          "gridPos": { "h": 8, "w": 12, "x": 6, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "avg(DCGM_FI_DEV_SM_CLOCK{Hostname=~\"$hostname\"})", "legendFormat": "SM MHz" },
            { "refId": "B", "expr": "avg(DCGM_FI_DEV_MEM_CLOCK{Hostname=~\"$hostname\"})", "legendFormat": "Mem MHz" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single", "sort": "none" } }
        },
        {
          "type": "stat", "title": "Last XID Error",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "expr": "max(DCGM_FI_DEV_XID_ERRORS{Hostname=~\"$hostname\"})", "legendFormat": "XID" }],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"], "values": false } }
        },
        {
          "type": "timeseries", "title": "ECC Errors (volatile SBE / DBE, 5m)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum(increase(DCGM_FI_DEV_ECC_SBE_VOL_TOTAL{Hostname=~\"$hostname\"}[5m]))", "legendFormat": "SBE" },
            { "refId": "B", "expr": "sum(increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL{Hostname=~\"$hostname\"}[5m]))", "legendFormat": "DBE" }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "single", "sort": "none" } }
        }
      ]
    }
